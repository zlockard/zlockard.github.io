<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" role="img" aria-labelledby="title description">
  <title id="title">Yes Madam - original VHS artwork</title>
  <desc id="description">An original Yes Madam video sleeve with a black VHS tape partly pulled out to the right. Secret microfilm concealed inside a passport.</desc>
  <defs>
    <linearGradient id="plastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#202529"/>
      <stop offset=".65" stop-color="#363d42"/>
      <stop offset="1" stop-color="#1b2023"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#000000" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grip" width="7" height="8" patternUnits="userSpaceOnUse">
      <path d="M1 2h5" stroke="#697379" stroke-width="1.5"/>
    </pattern>
    <g id="reel">
      <circle r="28" fill="#d6d0ba" stroke="#161b1e" stroke-width="2.5"/>
      <circle r="22" fill="none" stroke="#aaa38e" stroke-width="1.5"/>
      <path d="M0-19v9M16.5-9.5l-7.8 4.5M16.5 9.5l-7.8-4.5M0 19V10M-16.5 9.5l7.8-4.5M-16.5-9.5l7.8 4.5" fill="none" stroke="#343b3e" stroke-width="3" stroke-linecap="round"/>
      <circle r="6" fill="#202529"/>
    </g>
  </defs>
  <ellipse cx="150" cy="421" rx="143" ry="12" fill="url(#shadow)"/>
  <g id="cassette" transform="translate(-23.36 -32.56) scale(1.08)">
    <path id="cassette-top" d="M100 63l6.5-4.55a6 6 0 0 1 6-6h180a6 6 0 0 1 6 6L292 63a6 6 0 0 0-6-6H106a6 6 0 0 0-6 6Z" fill="#586369" stroke="#111719" stroke-width="1"/>
    <path id="cassette-right" d="M292 63l6.5-4.55v338a6 6 0 0 1-2.559 4.915l-6.5 4.55A6 6 0 0 0 292 401Z" fill="#141a1e" stroke="#111719" stroke-width="1"/>
    <rect x="100" y="57" width="192" height="350" rx="6" fill="url(#plastic)" stroke="#111719" stroke-width="2"/>
    <path d="M105 65h179v333" fill="none" stroke="#727e84" stroke-width="1"/>
    <rect x="278" y="91" width="7" height="279" fill="url(#grip)"/>
    <rect x="164" y="94" width="80" height="278" rx="14" fill="#485250" stroke="#14191c" stroke-width="3"/>
    <path d="M187 143h46v182h-46Z" fill="#171d1d"/>
    <path d="M235 157v154" stroke="#79827a" stroke-width="1" opacity=".5"/>
    <use href="#reel" x="210" y="143"/>
    <use href="#reel" x="210" y="325"/>
    <rect x="253" y="157" width="18" height="151" rx="2" fill="#eee6cf"/>
    <text x="262" y="233" transform="rotate(90 262 233)" text-anchor="middle" dominant-baseline="middle" fill="#24342e" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0">YES MADAM</text>
    <text x="263" y="356" transform="rotate(90 263 356)" text-anchor="middle" fill="#c3cacc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="italic">VHS</text>
    <g fill="#8b9599" stroke="#151a1d" stroke-width="1.5">
      <circle cx="282" cy="76" r="3"/>
      <circle cx="282" cy="389" r="3"/>
      <path d="m280.5 74.5 3 3m-3 310 3 3"/>
    </g>
  </g>
  <g id="case" data-colorway="lagoon">
    <path d="m2 30 10-7h210.5l-10 7Z" fill="#2e797d"/>
    <rect x="2" y="30" width="210.5" height="380" fill="#005b60" stroke="#fff3ce" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M12 42h190.5v356H12Z" fill="none" stroke="#fff3ce" stroke-opacity=".25" stroke-width="1"/>
    <path d="M27 49h80" stroke="#fff3ce" stroke-width="5"/>
    <path d="M107 49h44" stroke="#ffd17c" stroke-width="5"/>
    <path d="M151 49h36" stroke="#efb6cf" stroke-width="5"/>
    <g id="cover-design" data-layout="art-first">
      <g id="cover-layout-background"><circle cx="107.25" cy="146" r="73" fill="#efb6cf" opacity=".14"/><path d="M27 251h160" stroke="#ffd17c" stroke-width="2"/></g>
      <g id="cover-title" font-family="Verdana, Geneva, sans-serif" font-weight="700" font-style="normal" data-typeface="wide" data-leading="1.1"><text x="27" y="302.067" text-anchor="start" fill="#ffd17c" font-size="37.762" xmlns="http://www.w3.org/2000/svg">YES</text><text x="27" y="343.605" text-anchor="start" fill="#fff3ce" font-size="37.762" xmlns="http://www.w3.org/2000/svg">MADAM</text></g>
      <g id="movie-illustration">
        <g transform="translate(45 75) scale(1.5)"><path d="M14 9h52v62H14Z" fill="#fff3ce" xmlns="http://www.w3.org/2000/svg" /><path d="M24 16h32v20H24Zm0 28h32v20H24Z" fill="#ffd17c" xmlns="http://www.w3.org/2000/svg" /><path d="M18 15v5m0 8v5m0 8v5m0 8v5m44-44v5m0 8v5m0 8v5m0 8v5" stroke="#005b60" stroke-width="3" xmlns="http://www.w3.org/2000/svg" /><path d="m36 21 11 5-11 5Z" fill="#005b60" xmlns="http://www.w3.org/2000/svg" /></g>
        <g transform="translate(137 196) scale(.6)"><path d="M13 8h50v64H13Z" fill="#ffd17c" stroke="#fff3ce" stroke-width="3" xmlns="http://www.w3.org/2000/svg" /><circle cx="38" cy="33" r="14" fill="none" stroke="#005b60" stroke-width="2" xmlns="http://www.w3.org/2000/svg" /><ellipse cx="38" cy="33" rx="6" ry="14" fill="none" stroke="#005b60" stroke-width="2" xmlns="http://www.w3.org/2000/svg" /><path d="M24 33h28M25 58h26" stroke="#005b60" stroke-width="2" xmlns="http://www.w3.org/2000/svg" /></g>
      </g>
    </g>
    <path d="M27 366h160" stroke="#fff3ce" stroke-opacity=".4" stroke-width="1"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#fff3ce" font-size="14">
      <text x="27" y="389" letter-spacing="1">1985</text>
      <text x="187" y="389" text-anchor="end" font-style="italic">VHS</text>
    </g>
  </g>
</svg>