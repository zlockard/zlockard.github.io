<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" role="img" aria-labelledby="title description">
  <title id="title">Primal Rage - original VHS artwork</title>
  <desc id="description">An original Primal Rage video sleeve with a black VHS tape partly pulled out to the right. A spreading rage-virus cell and an experimental flask.</desc>
  <defs>
    <linearGradient id="plastic" x1="0%" y1="0%" x2="100%" y2="0%">
