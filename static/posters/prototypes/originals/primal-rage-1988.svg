    <path id="cassette-right" d="M292 63l6.5-4.55v338a6 6 0 0 1-2.559 4.915l-6.5 4.55A6 6 0 0 0 292 401Z" fill="#141a1e" stroke="#111719" stroke-width="1"/>
    <rect x="100" y="57" width="192" height="350" rx="6" fill="url(#plastic)" stroke="#111719" stroke-width="2"/>
    <path d="M105 65h179v333" fill="none" stroke="#727e84" stroke-width="1"/>
    <rect x="278" y="91" width="7" height="279" fill="url(#grip)"/>
    <rect x="164" y="94" width="80" height="278" rx="14" fill="#485250" stroke="#14191c" stroke-width="3"/>
