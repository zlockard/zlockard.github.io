        <g transform="translate(145 315) scale(.5)"><path d="m4 59 13-22H9l15-25 15 25h-8l13 22H28v14h-8V59Zm35-10 12-21h-6L58 5l13 23h-6l12 21H62v24h-8V49Z" fill="#fff0bf" xmlns="http://www.w3.org/2000/svg" /><path d="M4 75h72" stroke="#f4c36b" stroke-width="3" xmlns="http://www.w3.org/2000/svg" /></g>
