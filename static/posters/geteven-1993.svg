    <text x="262" y="233" transform="rotate(90 262 233)" text-anchor="middle" dominant-baseline="middle" fill="#24342e" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0">GETEVEN</text>
    <text x="263" y="356" transform="rotate(90 263 356)" text-anchor="middle" fill="#c3cacc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="italic">VHS</text>
    <g fill="#8b9599" stroke="#151a1d" stroke-width="1.5">
      <circle cx="282" cy="76" r="3"/>
      <circle cx="282" cy="389" r="3"/>
