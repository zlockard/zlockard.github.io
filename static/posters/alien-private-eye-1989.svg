        <g transform="translate(25 307) scale(.55)"><path d="m23 44 5-27q12 8 24 0l6 27 16 13q-34 14-68 0Z" fill="#2f3159" xmlns="http://www.w3.org/2000/svg" /><path d="M24 39h33v7H24Z" fill="#70304c" xmlns="http://www.w3.org/2000/svg" /><path d="M22 64q6-7 16 0 5-7 16 0-6 10-16 2-9 8-16-2Z" fill="#70304c" xmlns="http://www.w3.org/2000/svg" /></g>
