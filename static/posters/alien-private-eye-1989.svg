    <rect x="2" y="30" width="210.5" height="380" fill="#c4bae4" stroke="#2f3159" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M12 42h190.5v356H12Z" fill="none" stroke="#2f3159" stroke-opacity=".25" stroke-width="1"/>
