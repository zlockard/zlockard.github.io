      <g id="cover-title" font-family="Courier New, Courier, monospace" font-weight="700" font-style="normal" data-typeface="mono" data-leading="1.08"><text x="28.745" y="93.824" text-anchor="start" fill="#70304c" font-size="32.318" xmlns="http://www.w3.org/2000/svg">ALIEN</text><text x="28.745" y="128.727" text-anchor="start" fill="#2f3159" font-size="32.318" xmlns="http://www.w3.org/2000/svg">PRIVATE</text><text x="28.745" y="163.631" text-anchor="start" fill="#2f3159" font-size="32.318" xmlns="http://www.w3.org/2000/svg">EYE</text></g>
