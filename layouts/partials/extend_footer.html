<script>
    const mobileTrailers = window.matchMedia("(max-width: 1023.98px)");

    document.querySelectorAll(".movie-trailer").forEach(trailer => {
        const template = trailer.querySelector("template");
        const player = trailer.querySelector(".movie-trailer-player");
        const status = trailer.querySelector(".movie-trailer-status");

        const updatePlayer = () => {
            if (trailer.open && !player.firstElementChild) {
                status.textContent = "Loading trailer...";
                status.hidden = false;
                player.setAttribute("aria-busy", "true");

                const iframe = template.content.firstElementChild.cloneNode(true);
                const finishLoading = (message = "") => {
                    if (iframe.parentElement !== player) {
                        return;
                    }
                    player.setAttribute("aria-busy", "false");
                    status.hidden = !message;
                    if (message) {
                        status.textContent = message;
                    }
                };

                iframe.addEventListener("load", () => finishLoading(), { once: true });
                iframe.addEventListener("error", () => finishLoading(
                    mobileTrailers.matches
                        ? "The trailer couldn't load. Close and reopen it to try again."
                        : "The trailer couldn't load. Reload the page to try again."
                ), { once: true });
                player.replaceChildren(iframe);
            } else if (!trailer.open) {
                player.replaceChildren();
                player.setAttribute("aria-busy", "false");
                status.hidden = true;
            }
        };

        const updateLayout = () => {
            trailer.open = !mobileTrailers.matches;
            updatePlayer();
        };

        trailer.addEventListener("toggle", updatePlayer);
        mobileTrailers.addEventListener("change", updateLayout);
        updateLayout();
    });
</script>
