<!-- movie trailer -->
<td class="movie-object movie-clip">
<details class="movie-trailer">
<summary>
  <span class="movie-trailer-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
  <span class="movie-trailer-show">Watch trailer</span>
  <span class="movie-trailer-hide">Hide trailer</span>
</summary>
<div class="movie-trailer-frame">
  <div class="movie-trailer-player" aria-busy="false"></div>
  <p class="movie-trailer-status" role="status" hidden>Loading trailer...</p>
</div>
<template>
<iframe width="100%" height="100%" style="object-fit:fill;" src="https://www.youtube.com/embed/{{ .Get 0 }}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</template>
</details>
<noscript><p>Enable JavaScript to watch trailers here.</p></noscript>
</td>
