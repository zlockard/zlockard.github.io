<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" role="img" aria-labelledby="title description">
  <title id="title">Magic Crystal - original VHS artwork</title>
  <desc id="description">An original Magic Crystal video sleeve with a black VHS tape partly pulled out to the right. A glowing mysterious crystal and an ancient Greek temple.</desc>
  <defs>
