    <path id="cassette-right" d="M292 63l6.5-4.55v338a6 6 0 0 1-2.559 4.915l-6.5 4.55A6 6 0 0 0 292 401Z" fill="#141a1e" stroke="#111719" stroke-width="1"/>
    <rect x="100" y="57" width="192" height="350" rx="6" fill="url(#plastic)" stroke="#111719" stroke-width="2"/>
    <path d="M105 65h179v333" fill="none" stroke="#727e84" stroke-width="1"/>
    <rect x="278" y="91" width="7" height="279" fill="url(#grip)"/>
    <rect x="164" y="94" width="80" height="278" rx="14" fill="#485250" stroke="#14191c" stroke-width="3"/>
    <path d="M187 143h46v182h-46Z" fill="#171d1d"/>
    <path d="M235 157v154" stroke="#79827a" stroke-width="1" opacity=".5"/>
    <use href="#reel" x="210" y="143"/>
    <use href="#reel" x="210" y="325"/>
    <rect x="253" y="157" width="18" height="151" rx="2" fill="#eee6cf"/>
    <text x="262" y="233" transform="rotate(90 262 233)" text-anchor="middle" dominant-baseline="middle" fill="#24342e" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0">FRANKENHOOKER</text>
    <text x="263" y="356" transform="rotate(90 263 356)" text-anchor="middle" fill="#c3cacc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="italic">VHS</text>
    <g fill="#8b9599" stroke="#151a1d" stroke-width="1.5">
