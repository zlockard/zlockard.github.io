      <circle r="22" fill="none" stroke="#aaa38e" stroke-width="1.5"/>
      <path d="M0-19v9M16.5-9.5l-7.8 4.5M16.5 9.5l-7.8-4.5M0 19V10M-16.5 9.5l7.8-4.5M-16.5-9.5l7.8 4.5" fill="none" stroke="#343b3e" stroke-width="3" stroke-linecap="round"/>
      <circle r="6" fill="#202529"/>
    </g>
  </defs>
  <ellipse cx="150" cy="421" rx="143" ry="12" fill="url(#shadow)"/>
  <g id="cassette" transform="translate(-23.36 -32.56) scale(1.08)">
