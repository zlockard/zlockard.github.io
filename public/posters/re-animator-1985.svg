<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450" role="img" aria-labelledby="title description">
  <title id="title">Re-Animator - original VHS artwork</title>
  <desc id="description">An original Re-Animator video sleeve with a black VHS tape partly pulled out to the right. A bright green reagent vial and a returning heartbeat.</desc>
  <defs>
    <linearGradient id="plastic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop stop-color="#202529"/>
      <stop offset=".65" stop-color="#363d42"/>
      <stop offset="1" stop-color="#1b2023"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop stop-color="#000000" stop-opacity=".22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grip" width="7" height="8" patternUnits="userSpaceOnUse">
      <path d="M1 2h5" stroke="#697379" stroke-width="1.5"/>
    </pattern>
    <g id="reel">
      <circle r="28" fill="#d6d0ba" stroke="#161b1e" stroke-width="2.5"/>
      <circle r="22" fill="none" stroke="#aaa38e" stroke-width="1.5"/>
      <path d="M0-19v9M16.5-9.5l-7.8 4.5M16.5 9.5l-7.8-4.5M0 19V10M-16.5 9.5l7.8-4.5M-16.5-9.5l7.8 4.5" fill="none" stroke="#343b3e" stroke-width="3" stroke-linecap="round"/>
      <circle r="6" fill="#202529"/>
    </g>
  </defs>
  <ellipse cx="150" cy="421" rx="143" ry="12" fill="url(#shadow)"/>
  <g id="cassette" transform="translate(-23.36 -32.56) scale(1.08)">
    <path id="cassette-top" d="M100 63l6.5-4.55a6 6 0 0 1 6-6h180a6 6 0 0 1 6 6L292 63a6 6 0 0 0-6-6H106a6 6 0 0 0-6 6Z" fill="#586369" stroke="#111719" stroke-width="1"/>
    <path id="cassette-right" d="M292 63l6.5-4.55v338a6 6 0 0 1-2.559 4.915l-6.5 4.55A6 6 0 0 0 292 401Z" fill="#141a1e" stroke="#111719" stroke-width="1"/>
    <rect x="100" y="57" width="192" height="350" rx="6" fill="url(#plastic)" stroke="#111719" stroke-width="2"/>
    <path d="M105 65h179v333" fill="none" stroke="#727e84" stroke-width="1"/>
    <rect x="278" y="91" width="7" height="279" fill="url(#grip)"/>
    <rect x="164" y="94" width="80" height="278" rx="14" fill="#485250" stroke="#14191c" stroke-width="3"/>
    <path d="M187 143h46v182h-46Z" fill="#171d1d"/>
    <path d="M235 157v154" stroke="#79827a" stroke-width="1" opacity=".5"/>
    <use href="#reel" x="210" y="143"/>
    <use href="#reel" x="210" y="325"/>
    <rect x="253" y="157" width="18" height="151" rx="2" fill="#eee6cf"/>
    <text x="262" y="233" transform="rotate(90 262 233)" text-anchor="middle" dominant-baseline="middle" fill="#24342e" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="bold" letter-spacing="0">RE-ANIMATOR</text>
    <text x="263" y="356" transform="rotate(90 263 356)" text-anchor="middle" fill="#c3cacc" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" font-style="italic">VHS</text>
    <g fill="#8b9599" stroke="#151a1d" stroke-width="1.5">
      <circle cx="282" cy="76" r="3"/>
      <circle cx="282" cy="389" r="3"/>
      <path d="m280.5 74.5 3 3m-3 310 3 3"/>
    </g>
  </g>
  <g id="case" data-colorway="midnight">
    <path d="m2 30 10-7h210.5l-10 7Z" fill="#3e505f"/>
    <rect x="2" y="30" width="210.5" height="380" fill="#142a3c" stroke="#f5ead2" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M12 42h190.5v356H12Z" fill="none" stroke="#f5ead2" stroke-opacity=".25" stroke-width="1"/>
    <path d="M27 49h80" stroke="#f5ead2" stroke-width="5"/>
    <path d="M107 49h44" stroke="#92e0d4" stroke-width="5"/>
    <path d="M151 49h36" stroke="#ffbd87" stroke-width="5"/>
    <g id="cover-design" data-layout="right-stack">
      <g id="cover-layout-background"><circle cx="108" cy="261" r="81" fill="#ffbd87" opacity=".15"/><path d="M19 80v88" stroke="#92e0d4" stroke-width="4"/></g>
      <g id="cover-title" font-family="Courier New, Courier, monospace" font-weight="700" font-style="normal" data-typeface="mono" data-leading="1.08"><text x="184.944" y="109.947" text-anchor="end" fill="#92e0d4" font-size="32.927" xmlns="http://www.w3.org/2000/svg">RE-</text><text x="184.944" y="145.508" text-anchor="end" fill="#f5ead2" font-size="32.927" xmlns="http://www.w3.org/2000/svg">ANIMATOR</text></g>
      <g id="movie-illustration">
        <g transform="translate(29 187) scale(1.62)"><rect x="22" y="19" width="36" height="54" rx="5" fill="none" stroke="#f5ead2" stroke-width="3" xmlns="http://www.w3.org/2000/svg" /><path d="M26 49q7-5 14 0t14 0v18q0 2-3 2H29q-3 0-3-2Z" fill="#92e0d4" xmlns="http://www.w3.org/2000/svg" /><rect x="20" y="7" width="40" height="14" rx="2" fill="#f5ead2" xmlns="http://www.w3.org/2000/svg" /><path d="M26 10v8m9-8v8m9-8v8m9-8v8" stroke="#142a3c" stroke-width="2" xmlns="http://www.w3.org/2000/svg" /><rect x="29" y="30" width="22" height="12" rx="1" fill="#ffbd87" xmlns="http://www.w3.org/2000/svg" /><path d="M33 36h14" stroke="#142a3c" stroke-width="2" xmlns="http://www.w3.org/2000/svg" /></g>
        <g transform="translate(145 315) scale(.5)"><path d="M2 43h17l9-25 14 45 10-31 8 11h18" fill="none" stroke="#92e0d4" stroke-width="5" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" /></g>
