    <path d="M27 366h160" stroke="#f5ead2" stroke-opacity=".4" stroke-width="1"/>
    <g font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#f5ead2" font-size="14">
      <text x="27" y="389" letter-spacing="1">1985</text>
      <text x="187" y="389" text-anchor="end" font-style="italic">VHS</text>
